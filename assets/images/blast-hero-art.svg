<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="">
  <defs>
    <linearGradient id="flowGradWide" x1="0%" y1="0%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="#FE7612" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#0678CE" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0678CE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flowGradMid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0678CE" stop-opacity="0"/>
      <stop offset="30%" stop-color="#0678CE" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#FE7612" stop-opacity="0.5"/>
