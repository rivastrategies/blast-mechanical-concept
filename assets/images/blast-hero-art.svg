    </linearGradient>
    <linearGradient id="flowGradThin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F3F4F6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F3F4F6" stop-opacity="0.35"/>
